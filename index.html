<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 취향 저장소: 기록과 감성</title>
    <style>
        /* 1. 배경 설정: 보내주신 사진의 청량한 느낌 */
        body { 
            font-family: 'Apple SD Gothic Neo', 'Nanum Gothic', sans-serif; 
            line-height: 1.8; 
            max-width: 800px; 
            margin: 0 auto; 
            /* 여백의 미를 위해 상하 패딩을 넉넉히 줍니다 */
            padding: 100px 20px; 
            background-color: #e0f2f1; /* 청량한 민트 하늘색 */
            color: #334e4e;
        }

        /* 2. 제목: 깔끔하고 감각적인 배치 */
        h1 { 
            text-align: left;
            color: #00796b; 
            font-size: 2.6em;
            margin-bottom: 80px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        /* 3. 콘텐츠 박스: 여백(Negative Space)을 극대화한 디자인 */
        .content-box { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 60px; /* 박스 내부 여백을 아주 넓게 주어 시원한 느낌 유도 */
            border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.04); 
            margin-bottom: 50px;
        }

        h2 { 
            color: #222; 
            font-size: 1.7em;
            margin: 10px 0 25px 0;
        }

        /* 태그: 사진 속 노란 표지판 포인트 색상 */
        .tag { 
            display: inline-block;
            color: #fbc02d; 
            font-weight: bold; 
            font-size: 1em;
            margin-bottom: 10px;
        }

        p { 
            color: #555; 
            font-size: 1.1em;
            word-break: keep-all; /* 한글 문장이 예쁘게 끊기도록 설정 */
        }
    </style>
</head>
<body>

    <h1>|나의 취향 저장소|</h1>

    <div class="content-box">
        <span class="tag">#내가 사랑하는 책</span>
        <h2>책 제목을 여기에 적어주세요</h2>
        <p>이곳에 책에 대한 소개를 적어보세요. 사진 속 바닷가 도로처럼 시원한 느낌이 들도록 문장을 간결하게 다듬어보시는 건 어떨까요? 여백이 주는 편안함을 느껴보세요.</p>
    </div>

    <div class="content-box">
    <span class="tag">#나의 최애 캐릭터</span>
    <h2>캐릭터 소개 보러가기</h2>
    <p>제가 정말 좋아하는 캐릭터를 소개합니다! <a href="hero.html" style="color: #00796b; font-weight: bold; text-decoration: underline;">[여기]를 눌러서 확인해 보세요.</a></p>
</div>

</body>
</html>
