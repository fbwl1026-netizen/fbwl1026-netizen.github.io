<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 기록: 책과 캐릭터</title>
    <style>
        /* 간단한 디자인 추가 */
        body { 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            line-height: 1.8; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px;
            background-color: #f9f9f9;
        }
        h1 { color: #2c3e50; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
        .content-box { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            margin-bottom: 20px;
        }
        .tag { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

    <h1>📖 나의 취향 저장소</h1>

    <div class="content-box">
        <h2>📚 내가 좋아하는 책</h2>
        <p class="tag">#책제목입력</p>
        <p>이 책을 좋아하는 이유나 인상 깊은 구절을 여기에 적어보세요.</p>
    </div>

    <div class="content-box">
        <h2>✨ 내가 좋아하는 캐릭터</h2>
        <p class="tag">#캐릭터이름입력</p>
        <p>캐릭터의 특징이나 왜 이 캐릭터를 선택했는지 설명해 보세요.</p>
    </div>

</body>
</html>
